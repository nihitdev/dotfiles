# ─────────────────────────────────────────────────────────────────────────────
# Yazi
# ─────────────────────────────────────────────────────────────────────────────

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
sort_fallback  = "alphabetical"
linemode       = "mtime"
show_hidden    = false
show_symlink   = true
scrolloff      = 8
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 1000
max_height    = 1000
image_delay   = 0
image_filter  = "triangle"
image_quality = 80

# Scoop's Windows `file.exe` lacks the `-L` option required by Yazi.
# Use Yazi's official extension-based MIME provider so preview routing works.
[[plugin.prepend_fetchers]]
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"

# Show Git status alongside filenames without replacing Yazi's MIME fetchers.
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# Render Markdown with Glow. Piper uses the installed Git-for-Windows `sh`.
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- glow -w=$w -s=dark "$1"'

[[plugin.prepend_previewers]]
url = "*.markdown"
run = 'piper -- glow -w=$w -s=dark "$1"'
