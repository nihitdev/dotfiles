# ─────────────────────────────────────────────────────────────────────────────
# Repository Validation
# ─────────────────────────────────────────────────────────────────────────────

name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes lua5.4 yamllint

      - name: Check strict JSON files
        run: |
          jq empty \
            .config/nvim/lazy-lock.json \
            .config/nvim/lazyvim.json \
            .config/oh-my-posh/amro.omp.json \
            .config/windows-terminal/settings.json

      - name: Check Lua syntax
        run: find .config/nvim .config/yazi -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p

      - name: Check Git configuration
        run: git config --file .config/git/.gitconfig --list >/dev/null

      - name: Check repository formats and links
        run: |
          python3 .config/scripts/validate_repo.py
          yamllint -d relaxed \
            .github/workflows/validate.yml .config/lazygit/config.yml .config/yasb/config.yaml

      - name: Check Linux installer
        run: |
          bash -n install.sh
          ./install.sh --dry-run --only nvim --only ssh
          ./.config/tests/test-install.sh

      - name: Check Nushell portability guards
        run: |
          grep -Fq 'source $STARSHIP_CACHE' .config/nushell/config.nu
          grep -Fq 'source $ZOXIDE_CACHE' .config/nushell/config.nu
          grep -Fq 'has-command sudo' .config/nushell/config.nu

      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD

  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $Errors = $null
          $Tokens = $null
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors) { throw ($Errors | Out-String) }
          }

      - name: Test Windows installer safety
        shell: pwsh
        run: ./.config/tests/test-install.ps1
