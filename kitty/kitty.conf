# Tabs are rendered by tab.py through kitty's tab_bar.py entrypoint. Kitty
# retains ownership of terminal/tab state; the custom layer is presentation.
tab_bar_style custom
tab_bar_edge top
tab_bar_align start
tab_bar_margin_width 6
tab_bar_margin_height 4 2
tab_powerline_style round
tab_title_template "  {title}   󰅖  "
active_tab_title_template "  {title}   󰅖  "
tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes
tab_switch_strategy right

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Catppuccin Mocha tab bar (kept after the theme include so these values win).
tab_bar_background #1e1e2e
inactive_tab_background #313244
inactive_tab_foreground #cdd6f4
active_tab_background #cba6f7
active_tab_foreground #11111b
active_tab_font_style bold
