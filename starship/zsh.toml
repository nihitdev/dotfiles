# ============================================================
# Starship
# Minimal • Clean • Fast
# ============================================================

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
scan_timeout = 100
command_timeout = 1000

format = """
$directory$git_branch$git_status
$character"""

# ------------------------------------------------------------
# Directory
# ------------------------------------------------------------

[directory]
style = "bold cyan"
format = "[$path]($style) "
home_symbol = "~"
truncation_length = 0
truncate_to_repo = false
read_only = " "

# ------------------------------------------------------------
# Git
# ------------------------------------------------------------

[git_branch]
symbol = " "
style = "#cba6f7"
format = "[$symbol$branch]($style)"

[git_status]
style = "bold red"
format = " [$all_status$ahead_behind]($style)"

